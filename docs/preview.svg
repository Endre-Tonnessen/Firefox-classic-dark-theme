    <text x="22" y="180" font-size="12" fill="#f9f9fa">Firefox Add-ons</text>
    <text x="22" y="206" font-size="12" fill="#f9f9fa">MDN Web Docs</text>
    <!-- new tab page -->
    <rect x="201" y="90" width="679" height="330" fill="#201f26"/>
    <rect x="300" y="130" width="480" height="38" rx="6" fill="#35343e"/>
    <text x="318" y="154" font-size="13" fill="#fbfbfe" opacity="0.8">Search the web</text>
    <g fill="#35343e">
      <rect x="300" y="196" width="96" height="80" rx="8"/>
      <rect x="428" y="196" width="96" height="80" rx="8"/>
      <rect x="556" y="196" width="96" height="80" rx="8"/>
      <rect x="684" y="196" width="96" height="80" rx="8"/>
    </g>
    <!-- popup menu -->
    <rect x="610" y="88" width="250" height="150" rx="6" fill="#35343e" stroke="#45454f"/>
    <rect x="616" y="96" width="238" height="28" rx="4" fill="#201f26"/>
    <text x="628" y="115" font-size="12" fill="#fbfbfe">New window</text>
    <text x="628" y="147" font-size="12" fill="#fbfbfe">New private window</text>
    <rect x="620" y="162" width="230" height="1" fill="#45454f"/>
    <text x="628" y="187" font-size="12" fill="#fbfbfe">Bookmarks</text>
    <text x="628" y="217" font-size="12" fill="#fbfbfe">Settings</text>
